openapi: 3.1.0
info:
  title: Decrypt the Narrative API
  version: 1.2.0
servers:
  - url: /
paths:
  /auth:
    post:
      summary: Issue a token or return existing valid one
      description: |
        Authenticate a team and issue or reuse a token.

        **Hints:**
        - Include your team name in the `team` header.
        - Team names must be ≤20 characters (letters, numbers, spaces, underscores only).
        - Using the same name again reuses the same token (until idle timeout).
        - If you hit `"Token expired"`, just call `/auth` again.
        - The number in `remaining` shows how many `/fragment` requests you have left.
      parameters:
        - name: team
          in: header
          required: true
          schema:
            type: string
            maxLength: 20
            pattern: "^[A-Za-z0-9 _]+$"
          description: Team name (max 20 chars; letters, digits, spaces, underscores only)
      responses:
        "200":
          description: Token issued or reused
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  team: { type: string }
                  remaining: { type: integer }
        "400":
          description: Missing or invalid team header
        "403":
          description: Forbidden
        "401":
          description: Unauthorized

  /fragment:
    get:
      summary: Return a random fragment or chaos response
      description: |
        Retrieve a random word fragment or trigger a chaos event (~10% chance).

        **Hints:**
        - Requires both `team` and `token` headers from `/auth`.
        - Each successful call decrements your token quota.
        - Chaos may strike randomly. Possible effects include:
          - **Delay:** Slow or delayed response.
          - **Malformed JSON:** Truncated or invalid payload.
          - **Broken JSON:** Garbled body, won't parse.
          - **Error code:** 418, 429, 500, or 504 responses.
          - **Duplicate fragment:** Two of the same fragment.
          - **Empty response:** `{}` returned.
          - **HTML injection:** Non-JSON content disguised as JSON.
          - **Slow burst:** Multiple small pauses.
          - **Token drain:** Reduces your remaining quota by extra 1–3.
          - **Reverse text:** Word reversed.
          - **Unicode garble:** Adds strange Unicode symbols.
          - **Out of order:** Returns fragment from the end of the text.
        - Handle every case gracefully—resilience and retry logic are key.
      parameters:
        - name: team
          in: header
          required: true
          schema: { type: string }
        - name: token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Normal or chaotic fragment response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      word: { type: string }
                      position: { type: integer }
                  - type: object
                    properties:
                      fragments:
                        type: array
                        items:
                          type: object
                          properties:
                            word: { type: string }
                            position: { type: integer }
                  - type: object
                    description: May be empty or malformed
        "400":
          description: Missing headers or bad request
        "401":
          description: Token expired
        "403":
          description: Invalid token or limit reached
        "418":
          description: Chaos error (418)
        "429":
          description: Chaos error (429)
        "500":
          description: Chaos error (500)
        "504":
          description: Chaos error (504)

  /validate:
    post:
      summary: Validate a team's submitted sentence
      description: |
        Submit your full reconstructed sentence for validation.

        **Hints:**
        - Include both `team` and `token` headers from `/auth`.
        - Body must contain a `submission` field with your full sentence.
        - Comparison ignores punctuation and case.
        - On failure, you can correct and retry.
        - On success, you’ll see:
          - `"status": "success"`
          - `"duration"` showing total time taken.
          - `"completed_at"` timestamp.
      parameters:
        - name: team
          in: header
          required: true
          schema: { type: string }
        - name: token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submission:
                  type: string
                  description: Full reconstructed sentence
      responses:
        "200":
          description: Successful validation
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { type: string }
                  status: { type: string }
                  message: { type: string }
                  completed_at: { type: number }
                  duration: { type: number }
        "400":
          description: Incorrect or missing submission
        "403":
          description: Invalid or expired token
