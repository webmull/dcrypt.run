openapi: 3.1.0
info:
  title: Decrypt the Narrative API
  version: 1.1.0
servers:
  - url: /
paths:
  /auth:
    post:
      summary: Issue a token or return existing valid one
      description: Authenticate a team and issue or reuse a token.
      parameters:
        - name: team
          in: header
          required: true
          schema:
            type: string
            maxLength: 20
            pattern: "^[A-Za-z0-9 _]+$"
          description: Team name (max 20 chars; letters, digits, spaces, underscores only)
      responses:
        "200":
          description: Token issued or reused
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  team: { type: string }
                  remaining: { type: integer }
        "400":
          description: Missing or invalid team header
        "403":
          description: Forbidden
        "401":
          description: Unauthorized

  /fragment:
    get:
      summary: Return a random fragment or chaos response
      description: |
        Returns a random word fragment or triggers one of several chaos types (~10% chance):
        delay, malformed_json, broken_json, error_code, duplicate_fragment,
        empty_response, html_injection, slow_burst, token_drain, reverse_text,
        unicode_garble, out_of_order.
      parameters:
        - name: team
          in: header
          required: true
          schema: { type: string }
        - name: token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Normal or chaotic fragment response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      word: { type: string }
                      position: { type: integer }
                  - type: object
                    properties:
                      fragments:
                        type: array
                        items:
                          type: object
                          properties:
                            word: { type: string }
                            position: { type: integer }
                  - type: object
                    description: May be empty or malformed
        "400":
          description: Missing headers or bad request
        "401":
          description: Token expired
        "403":
          description: Invalid token or limit reached
        "418":
          description: Chaos error (418)
        "429":
          description: Chaos error (429)
        "500":
          description: Chaos error (500)
        "504":
          description: Chaos error (504)

  /validate:
    post:
      summary: Validate a team's submitted sentence
      parameters:
        - name: team
          in: header
          required: true
          schema: { type: string }
        - name: token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submission:
                  type: string
                  description: Full reconstructed sentence
      responses:
        "200":
          description: Successful validation
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { type: string }
                  status: { type: string }
                  message: { type: string }
                  completed_at: { type: number }
                  duration: { type: number }
        "400":
          description: Incorrect or missing submission
        "403":
          description: Invalid or expired token
