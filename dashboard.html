<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decrypt the Narrative Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0b0d0f;
      color: #e2e2e2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 20px 40px;
      background: linear-gradient(90deg, #0f1215, #1b1e22);
      border-bottom: 2px solid #1e4d2b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.8em;
      color: #00ff91;
      margin: 0;
      letter-spacing: 1px;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 1.1em;
    }

    .stats div {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: #00ff91;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      align-content: start;
    }

    .tile {
      background: #121416;
      border: 1px solid #1f2429;
      border-radius: 14px;
      padding: 18px;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 10px rgba(0, 255, 145, 0.2);
    }

    .tile h2 {
      font-size: 1.1em;
      margin: 0 0 10px 0;
      color: #00ff91;
    }

    .progress-bar {
      height: 8px;
      border-radius: 4px;
      background: #1f2429;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      transition: width 0.6s ease;
      background: linear-gradient(90deg, #00ff91, #00b36b);
    }

    .details {
      font-size: 0.9em;
      display: grid;
      gap: 4px;
      color: #cfd0d1;
    }

    .active-pulse {
      animation: pulse 1.5s ease;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0,255,100,0.4); }
      70% { box-shadow: 0 0 0 10px rgba(0,255,100,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,255,100,0); }
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.4em; }
      .stats { flex-wrap: wrap; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Decrypt the Narrative</h1>
    <div class="stats">
      <div><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /></svg>Teams: <span id="teamCount">0</span></div>
      <div><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>Chaos: <span id="chaosCount">0</span></div>
    </div>
  </header>
  <main id="dashboard"></main>

  <script>
    const DASH_URL = "http://127.0.0.1:8000/status";
    const REFRESH_INTERVAL = 2000;

    async function fetchStatus() {
      try {
        const res = await fetch(DASH_URL);
        return await res.json();
      } catch (e) {
        console.error("Error fetching status:", e);
        return null;
      }
    }

    function updateDashboard(data) {
      if (!data || !data.teams) return;
      const dashboard = document.getElementById("dashboard");

      // sort by last_active desc
      const sortedTeams = data.teams.sort((a, b) => b.last_active - a.last_active);

      document.getElementById("teamCount").textContent = sortedTeams.length;
      document.getElementById("chaosCount").textContent = data.total_chaos ?? 0;

      sortedTeams.forEach(team => {
        const seenPct = Math.min((team.seen_count / data.total_words) * 100, 100);
        const existing = document.getElementById(`tile-${team.team}`);

        const html = `
          <h2>${team.team}</h2>
          <div class="progress-bar"><div class="progress-fill" style="width:${seenPct}%"></div></div>
          <div class="details">
            <div>Seen: ${Math.round(seenPct)}%</div>
            <div>Requests left: ${team.remaining}</div>
            <div>Tokens issued: ${team.tokens_issued}</div>
            <div>Chaos events: ${team.chaos}</div>
            <div>Duration: ${team.duration.toFixed(1)}s</div>
            <div>Status: ${team.completed ? "✅ Completed" : "🔄 In Progress"}</div>
          </div>
        `;

        if (existing) {
          existing.innerHTML = html;
          existing.classList.add("active-pulse");
          setTimeout(() => existing.classList.remove("active-pulse"), 1500);
        } else {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${team.team}`;
          tile.innerHTML = html;
          dashboard.appendChild(tile);
        }
      });

      // remove tiles not in new data
      const existingTiles = Array.from(dashboard.children);
      existingTiles.forEach(tile => {
        if (!sortedTeams.find(t => `tile-${t.team}` === tile.id)) {
          tile.remove();
        }
      });
    }

    async function refresh() {
      const data = await fetchStatus();
      if (data) updateDashboard(data);
    }

    setInterval(refresh, REFRESH_INTERVAL);
    refresh();
  </script>
</body>
</html>
