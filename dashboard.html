<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Decrypt the Narrative – Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
body {
  margin:0;background:#004b2b;color:#f7f7f7;
  font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;min-height:100vh;overflow:hidden;
}
header{position:relative;display:flex;justify-content:center;align-items:center;flex-direction:column;margin-top:.8rem;margin-bottom:.5rem;}
header svg.title{width:760px;max-width:95%;height:150px;}
header text{font-family:'Inter',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:3px;fill:#ffda00;
  filter:drop-shadow(0 0 8px rgba(255,218,0,0.6));animation:textGlow 5s ease-in-out infinite;font-size:40px;}
@keyframes textGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,218,0,0.5));}50%{filter:drop-shadow(0 0 24px rgba(255,218,0,0.9));}}
.lines line{stroke-width:2.5;opacity:.8;}
.nodes circle{fill:#00ff99;opacity:.9;filter:drop-shadow(0 0 4px #00ff99);}
#header-particles{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;z-index:0;pointer-events:none;}
.particle{position:absolute;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffda00 0%,#00ff99 100%);
  opacity:.4;animation:float 14s linear infinite;}
@keyframes float{
  0%{transform:translateY(0) translateX(0) scale(1);}
  50%{transform:translateY(-120px) translateX(40px) scale(1.2);}
  100%{transform:translateY(-240px) translateX(0) scale(1);}
}
#summary{display:flex;justify-content:center;flex-wrap:wrap;gap:1.4rem;color:#cdeac0;margin:.6rem auto 1.2rem;text-align:center;z-index:2;position:relative;}
.summary-item{display:flex;align-items:center;gap:8px;font-size:clamp(1rem,1.9vw,1.4rem);font-weight:600;}
.summary-icon{width:clamp(22px,2.2vw,28px);height:clamp(22px,2.2vw,28px);stroke:#ffda00;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.summary-value b{color:#fff;font-weight:700;text-shadow:0 0 4px rgba(255,255,255,0.2);}
#teams{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1.2rem;padding:1rem;}
.team{position:relative;border-radius:18px;overflow:hidden;background:rgba(0,104,55,0.9);backdrop-filter:blur(8px);padding:1.4rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 4px 10px rgba(0,0,0,0.25);
  transition:transform .25s ease,box-shadow .3s ease;}
.team:hover{transform:translateY(-2px);}
.team::after{content:"";position:absolute;top:0;left:0;width:100%;height:6px;background:var(--accent-gradient);background-size:200% 100%;
  animation:var(--accent-animation);opacity:.95;}
.team.complete{background:rgba(0,122,69,0.95);border:1px solid rgba(0,204,102,0.4);}
@keyframes accentShimmer{0%{background-position:0 0;}100%{background-position:200% 0;}}
.team-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
.team h2{margin:0;font-size:1.35rem;color:#ffda00;}
.status-chip{padding:4px 10px;border-radius:6px;font-size:.85rem;font-weight:600;text-transform:uppercase;background:rgba(255,255,255,0.08);}
.status-chip.completed{color:#fff;background:rgba(0,204,102,0.25);}
.metric-group{background:rgba(255,255,255,0.04);border-radius:10px;padding:.8rem;display:grid;grid-template-columns:1fr 1fr;row-gap:6px;}
.metric-label{opacity:.9;display:flex;align-items:center;gap:8px;}
.metric-value{text-align:right;font-weight:600;}
.icon{width:22px;height:22px;stroke:#ffda00;stroke-width:2;fill:none;}
.bar{grid-column:1/3;width:100%;height:8px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;margin:3px 0 10px;}
.bar-fill{height:100%;transition:width .3s ease;background:#00cc66;}
#completion-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,75,43,0.95);
  color:#ffda00;font-family:'Inter',sans-serif;font-size:clamp(1.5rem,3vw,2.5rem);font-weight:700;
  padding:1rem 2rem;border-radius:12px;box-shadow:0 0 20px rgba(255,218,0,0.6);
  opacity:0;z-index:9999;pointer-events:none;transition:opacity .4s ease,transform .4s ease;}
#completion-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1.05);}
</style>
</head>
<body>

<header>
<div id="header-particles"></div>
<svg class="title" viewBox="0 0 700 160">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff99" />
      <stop offset="50%" stop-color="#ffda00" />
      <stop offset="100%" stop-color="#00ccff" />
      <animateTransform attributeName="gradientTransform" attributeType="XML" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <text x="50%" y="35%" text-anchor="middle" dominant-baseline="middle" font-size="40">Decrypt the Narrative</text>
  <g class="lines">
    <line x1="100" y1="110" x2="180" y2="80" stroke="url(#flowGradient)" />
    <line x1="180" y1="80" x2="260" y2="110" stroke="url(#flowGradient)" />
    <line x1="260" y1="110" x2="340" y2="70" stroke="url(#flowGradient)" />
    <line x1="340" y1="70" x2="420" y2="110" stroke="url(#flowGradient)" />
    <line x1="420" y1="110" x2="500" y2="80" stroke="url(#flowGradient)" />
    <line x1="500" y1="80" x2="580" y2="110" stroke="url(#flowGradient)" />
  </g>
  <g class="nodes">
    <circle cx="100" cy="110" r="4"/><circle cx="180" cy="80" r="4"/><circle cx="260" cy="110" r="4"/>
    <circle cx="340" cy="70" r="4"/><circle cx="420" cy="110" r="4"/><circle cx="500" cy="80" r="4"/><circle cx="580" cy="110" r="4"/>
  </g>
</svg>
</header>

<div id="summary">
  <div class="summary-item"><svg class="summary-icon" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="15" cy="9" r="3"/><path d="M4 20a7 7 0 0 1 16 0"/></svg><span>Teams:</span><span id="count-teams"><b>0</b></span></div>
  <div class="summary-item"><svg class="summary-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg><span>Tokens:</span><span id="count-tokens"><b>0</b></span></div>
  <div class="summary-item"><svg class="summary-icon" viewBox="0 0 24 24"><path d="M13 2l-1 6h-1l-1-6M5 8l2 4-2 4m14 0l-2-4 2-4"/></svg><span>Chaos:</span><span id="count-chaos"><b>0</b></span></div>
  <div class="summary-item"><svg class="summary-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6l4 6-4 6"/></svg><span>Completed:</span><span id="count-completed"><b>0</b></span></div>
</div>

<div id="teams"></div>
<div id="completion-banner"></div>

<script>
/* Floating header particles */
const container=document.getElementById("header-particles");
for(let i=0;i<15;i++){
  const p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"%";
  p.style.top=(30+Math.random()*60)+"%";
  p.style.animationDelay=Math.random()*8+"s";
  p.style.opacity=0.3+Math.random()*0.5;
  container.appendChild(p);
}

/* Dashboard logic */
let completedTeams=new Set(),confettiActive=false,bannerQueue=[],bannerShowing=false;
function formatDuration(sec){if(!sec)return"-";const m=Math.floor(sec/60);const s=Math.floor(sec%60);return`${m}m ${s}s`;}
function showCompletionBanner(teamName){bannerQueue.push(teamName);if(!bannerShowing)processBannerQueue();}
function processBannerQueue(){
  if(bannerQueue.length===0)return;
  bannerShowing=true;const teamName=bannerQueue.shift();
  const banner=document.getElementById("completion-banner");
  banner.textContent=`🎉 ${teamName} has completed the challenge! 🎉`;
  banner.classList.add("show");
  setTimeout(()=>{banner.classList.remove("show");bannerShowing=false;processBannerQueue();},4000);
}
function launchConfettiForTile(tileElement,duration){
 if(confettiActive||typeof confetti!=="function")return;
 confettiActive=true;
 const rect=tileElement.getBoundingClientRect();
 const x=(rect.left+rect.width/2)/window.innerWidth;
 const y=(rect.top+rect.height/2)/window.innerHeight;
 const bursts=3;let i=0;
 const scale=Math.min(1+(duration/60)*0.2,1.8);
 const interval=setInterval(()=>{
   confetti({particleCount:6*scale,spread:45*scale,startVelocity:25,ticks:80,gravity:0.6,scalar:0.6*scale,
     colors:["#00ff99","#ffda00","#ffffff"],origin:{x:x+(Math.random()-0.5)*0.08,y:y+(Math.random()-0.5)*0.1}});
   if(++i>=bursts){clearInterval(interval);confettiActive=false;}
 },250);
}
async function fetchStatus(){
  try{
    const res=await fetch("/status",{cache:"no-store"});
    const data=await res.json();
    const teams=data.teams||[];
    document.getElementById("count-teams").innerHTML=`<b>${teams.length}</b>`;
    document.getElementById("count-tokens").innerHTML=`<b>${teams.reduce((s,t)=>s+(t.tokens_issued||0),0)}</b>`;
    document.getElementById("count-chaos").innerHTML=`<b>${data.total_chaos||0}</b>`;
    document.getElementById("count-completed").innerHTML=`<b>${teams.filter(t=>t.completed).length}</b>`;
    const container=document.getElementById("teams");container.innerHTML="";
    const totalWords=data.total_words||50;
    teams.sort((a,b)=>b.seen_count-a.seen_count);
    for(const t of teams){
      const seenPercent=Math.min((t.seen_count/totalWords)*100,100);
      const remainingPercent=Math.min((t.remaining/20)*100,100);
      const card=document.createElement("div");
      card.className="team"+(t.completed?" complete":"");
      card.style.setProperty("--accent-gradient","linear-gradient(90deg,#00cc66,#00ff99)");
      card.style.setProperty("--accent-animation","accentShimmer 6s linear infinite");
      card.innerHTML=`
        <div class="team-header"><h2>${t.team}</h2><div class="status-chip ${t.completed?"completed":""}">${t.completed?"Completed":"Active"}</div></div>
        <div class="metric-group">
          <div class="metric-label"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>Seen</div>
          <div class="metric-value">${seenPercent.toFixed(0)}%</div>
          <div class="bar"><div class="bar-fill" style="width:${seenPercent}%;"></div></div>
          <div class="metric-label"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>Requests</div>
          <div class="metric-value">${t.remaining}</div>
          <div class="bar"><div class="bar-fill" style="width:${remainingPercent}%;background:#ffda00;"></div></div>
          <div class="metric-label">Chaos</div><div class="metric-value">${t.chaos||0}</div>
          <div class="metric-label">Duration</div><div class="metric-value">${formatDuration(t.duration)}</div>
        </div>`;
      container.appendChild(card);
      if(t.completed&&!completedTeams.has(t.team)){completedTeams.add(t.team);launchConfettiForTile(card,t.duration||0);showCompletionBanner(t.team);}
    }
  }catch(e){console.error(e);}
}
setInterval(fetchStatus,1500);
fetchStatus();
</script>
</body>
</html>
