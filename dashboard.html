<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Decrypt the Narrative – Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
body {
  margin:0;background:#004b2b;color:#f7f7f7;
  font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;
}
header{position:relative;display:flex;justify-content:center;align-items:center;flex-direction:column;margin-top:.8rem;margin-bottom:.5rem;}
header svg.title{width:720px;max-width:95%;height:140px;}
header text{font-family:'Inter',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:3px;fill:#ffda00;
  filter:drop-shadow(0 0 8px rgba(255,218,0,0.6));animation:textGlow 5s ease-in-out infinite;font-size:38px;}
@keyframes textGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,218,0,0.5));}50%{filter:drop-shadow(0 0 24px rgba(255,218,0,0.9));}}
.lines line{stroke-width:2.2;opacity:.9;}
.nodes circle{fill:#00ff99;opacity:.9;filter:drop-shadow(0 0 4px #00ff99);}
#header-particles{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;z-index:0;pointer-events:none;}
.particle{position:absolute;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffda00 0%,#00ff99 100%);
  opacity:.4;animation:float 12s linear infinite;}
@keyframes float{
  0%{transform:translateY(0) translateX(0) scale(1);}
  50%{transform:translateY(-120px) translateX(40px) scale(1.2);}
  100%{transform:translateY(-240px) translateX(0) scale(1);}
}
#summary{display:flex;justify-content:center;flex-wrap:wrap;gap:1.2rem;color:#cdeac0;margin:.4rem auto 1rem;text-align:center;z-index:2;position:relative;}
.summary-item{display:flex;align-items:center;gap:8px;font-size:clamp(1rem,1.8vw,1.3rem);font-weight:600;}
.summary-icon{width:clamp(22px,2.2vw,26px);height:clamp(22px,2.2vw,26px);stroke:#ffda00;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.summary-value b{color:#fff;font-weight:700;text-shadow:0 0 4px rgba(255,255,255,0.2);}

/* Grid now centered with max width */
#teams {
  flex:1;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,340px));
  gap:1.2rem;
  padding:1rem;
  justify-content:center;
  max-width:1200px;
  margin:0 auto 2rem;
}

/* Tiles */
.team {
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:rgba(0,104,55,0.9);
  backdrop-filter:blur(6px);
  padding:1.3rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 3px 8px rgba(0,0,0,0.25);
  transition:transform .25s ease,box-shadow .3s ease;
}
.team:hover{transform:translateY(-2px);}
.team::after{content:"";position:absolute;top:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,#00ff99,#ffda00,#00cc66);opacity:.9;}
.team.complete{background:rgba(0,122,69,0.95);border:1px solid rgba(0,204,102,0.4);}
.team-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.team h2{margin:0;font-size:1.4rem;color:#ffda00;letter-spacing:0.5px;}
.status-chip{padding:4px 10px;border-radius:6px;font-size:.9rem;font-weight:600;text-transform:uppercase;background:rgba(255,255,255,0.08);}
.status-chip.completed{color:#fff;background:rgba(0,204,102,0.25);}
.status-chip.ready{color:#ffda00;background:rgba(255,218,0,0.15);box-shadow:0 0 6px rgba(255,218,0,0.4);}
.metric-group{background:rgba(255,255,255,0.04);border-radius:10px;padding:.8rem;display:grid;grid-template-columns:1fr 1fr;row-gap:6px;}
.metric-label{opacity:.9;display:flex;align-items:center;gap:8px;font-size:1rem;}
.metric-value{text-align:right;font-weight:600;font-size:1rem;}
.bar{grid-column:1/3;width:100%;height:8px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;margin:3px 0 10px;}
.bar-fill{height:100%;transition:width 0.6s ease-in-out;transform-origin:left center;background:#00cc66;width:100%;}
.bar-fill.requests{background:#ffda00;}
#completion-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,75,43,0.95);
  color:#ffda00;font-family:'Inter',sans-serif;font-size:clamp(1.5rem,3vw,2.4rem);font-weight:700;
  padding:1rem 2rem;border-radius:12px;box-shadow:0 0 20px rgba(255,218,0,0.6);
  opacity:0;z-index:9999;pointer-events:none;transition:opacity .4s ease,transform .4s ease;}
#completion-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1.05);}
#docs-link {
  position:fixed;bottom:14px;right:18px;
  background:rgba(0,122,69,0.9);
  color:#ffda00;text-decoration:none;
  font-weight:600;font-size:0.9rem;
  padding:7px 12px;border-radius:7px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  transition:all 0.3s ease;z-index:50;
}
#docs-link:hover {background:#00cc66;color:#fff;box-shadow:0 0 12px rgba(0,255,120,0.6);}
</style>
</head>
<body>

<header>
<div id="header-particles"></div>
<svg class="title" viewBox="0 0 700 160">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff99">
        <animate attributeName="stop-color" values="#00ff99;#ffda00;#00cc66;#00ff99" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffda00">
        <animate attributeName="stop-color" values="#ffda00;#00cc66;#00ff99;#ffda00" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <text x="50%" y="35%" text-anchor="middle" dominant-baseline="middle" font-size="38">Decrypt the Narrative</text>
  <g class="lines">
    <line x1="100" y1="110" x2="180" y2="80" stroke="url(#flowGradient)" />
    <line x1="180" y1="80" x2="260" y2="110" stroke="url(#flowGradient)" />
    <line x1="260" y1="110" x2="340" y2="70" stroke="url(#flowGradient)" />
    <line x1="340" y1="70" x2="420" y2="110" stroke="url(#flowGradient)" />
    <line x1="420" y1="110" x2="500" y2="80" stroke="url(#flowGradient)" />
    <line x1="500" y1="80" x2="580" y2="110" stroke="url(#flowGradient)" />
  </g>
  <g class="nodes">
    <circle cx="100" cy="110" r="4"/><circle cx="180" cy="80" r="4"/><circle cx="260" cy="110" r="4"/>
    <circle cx="340" cy="70" r="4"/><circle cx="420" cy="110" r="4"/><circle cx="500" cy="80" r="4"/><circle cx="580" cy="110" r="4"/>
  </g>
</svg>
</header>

<div id="summary">
  <div class="summary-item"><svg class="summary-icon" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="15" cy="9" r="3"/><path d="M4 20a7 7 0 0 1 16 0"/></svg><span>Teams:</span><span id="count-teams"><b>0</b></span></div>
  <div class="summary-item"><svg class="summary-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg><span>Tokens:</span><span id="count-tokens"><b>0</b></span></div>
  <div class="summary-item"><svg class="summary-icon" viewBox="0 0 24 24"><path d="M13 2l-1 6h-1l-1-6M5 8l2 4-2 4m14 0l-2-4 2-4"/></svg><span>Chaos:</span><span id="count-chaos"><b>0</b></span></div>
  <div class="summary-item"><svg class="summary-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6l4 6-4 6"/></svg><span>Completed:</span><span id="count-completed"><b>0</b></span></div>
</div>

<div id="teams"></div>
<div id="completion-banner"></div>
<a id="docs-link" href="/docs" target="_blank">API Docs ↗</a>

<script>
/* Floating particles */
const field=document.getElementById("header-particles");
const particles=[];
const particleCount=25;
for(let i=0;i<particleCount;i++){
  const p=document.createElement("div");
  p.className="particle";
  resetParticle(p,true);
  field.appendChild(p);
  particles.push(p);
}
function resetParticle(p,init=false){
  p.style.left=Math.random()*100+"%";
  p.style.top=init?(Math.random()*100)+"%":"100%";
  p.style.animationDuration=10+Math.random()*6+"s";
}
function recycle(){
  for(const p of particles){
    const top=parseFloat(p.style.top);
    if(top<-5){resetParticle(p);}
    else{p.style.top=(top-0.2)+"%";}
  }
  requestAnimationFrame(recycle);
}
recycle();

/* Banner queue */
const banner=document.getElementById("completion-banner");
let bannerQueue=[];let bannerActive=false;let shownTeams=new Set();
function queueBanner(team){
  if(shownTeams.has(team))return;
  shownTeams.add(team);
  bannerQueue.push(team);
  processBannerQueue();
}
function processBannerQueue(){
  if(bannerActive||bannerQueue.length===0)return;
  bannerActive=true;
  const team=bannerQueue.shift();
  banner.innerText=`🎉 ${team} has completed the challenge! 🎉`;
  banner.classList.add("show");
  setTimeout(()=>{
    banner.classList.remove("show");
    bannerActive=false;
    setTimeout(processBannerQueue,600);
  },4000);
}

/* Bars + data */
function formatDuration(sec){if(!sec)return"-";const m=Math.floor(sec/60);const s=Math.floor(sec%60);return`${m}m ${s}s`;}
function updateBar(bar,value){
  const prev=parseFloat(bar.dataset.value);
  if(isNaN(prev)){bar.style.width=value+'%';bar.dataset.value=value;return;}
  if(Math.abs(value-prev)>0.1){
    bar.style.width=value+'%';
    bar.dataset.value=value;
  }
}
async function fetchStatus(){
  try{
    const res=await fetch("/status",{cache:"no-store"});
    const data=await res.json();
    const teams=data.teams||[];
    document.getElementById("count-teams").innerHTML=`<b>${teams.length}</b>`;
    document.getElementById("count-tokens").innerHTML=`<b>${teams.reduce((s,t)=>s+(t.tokens_issued||0),0)}</b>`;
    document.getElementById("count-chaos").innerHTML=`<b>${data.total_chaos||0}</b>`;
    document.getElementById("count-completed").innerHTML=`<b>${teams.filter(t=>t.completed).length}</b>`;
    const container=document.getElementById("teams");container.innerHTML="";
    const totalWords=data.total_words||50;

    teams.sort((a,b)=>b.seen_count-a.seen_count);
    for(const t of teams){
      const seenPercent=Math.min((t.seen_count/totalWords)*100,100);
      const remainingPercent=t.remaining&&t.max?Math.max((t.remaining/t.max)*100,0):100;
      const chipClass=t.completed?"completed":(seenPercent>=99?"ready":"");
      const chipLabel=t.completed?"Completed":(seenPercent>=99?"Ready to Submit":"Active");
      const card=document.createElement("div");
      card.className="team"+(t.completed?" complete":"");
      card.innerHTML=`
        <div class="team-header"><h2>${t.team}</h2><div class="status-chip ${chipClass}">${chipLabel}</div></div>
        <div class="metric-group">
          <div class="metric-label">Seen</div><div class="metric-value">${seenPercent.toFixed(0)}%</div>
          <div class="bar"><div class="bar-fill seen" data-value="${seenPercent}"></div></div>
          <div class="metric-label">Requests Left</div><div class="metric-value">${t.remaining}</div>
          <div class="bar"><div class="bar-fill requests" data-value="${remainingPercent}"></div></div>
          <div class="metric-label">Chaos</div><div class="metric-value">${t.chaos||0}</div>
          <div class="metric-label">Duration</div><div class="metric-value">${formatDuration(t.duration)}</div>
        </div>`;
      const fills=card.querySelectorAll('.bar-fill');
      container.appendChild(card);
      updateBar(fills[0],seenPercent);
      updateBar(fills[1],remainingPercent);
      if(t.completed)queueBanner(t.team);
    }
  }catch(e){console.error(e);}
}
setInterval(fetchStatus,1500);
fetchStatus();
</script>
</body>
</html>
