<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decrypt the Narrative Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f7f5;
      color: #222;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #00683A, #00A859);
      color: #fff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 1.8em;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .stats {
      display: flex;
      gap: 24px;
      font-size: 1.1em;
      font-weight: 500;
    }

    .stats div {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 30px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      align-content: start;
      background: #f5f7f5;
    }

    .tile {
      background: #fff;
      border: 1px solid #dcdcdc;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .tile h2 {
      font-size: 1.15em;
      margin: 0 0 8px;
      color: #00683A;
    }

    .progress-bar {
      height: 8px;
      border-radius: 4px;
      background: #e6e6e6;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      transition: width 0.6s ease;
      background: linear-gradient(90deg, #00A859, #00d172);
    }

    .details {
      font-size: 0.9em;
      display: grid;
      gap: 4px;
      color: #444;
    }

    .active-pulse {
      animation: pulse 1.5s ease;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0,168,89,0.4); }
      70% { box-shadow: 0 0 0 10px rgba(0,168,89,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,168,89,0); }
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.4em; }
      .stats { flex-wrap: wrap; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Decrypt the Narrative</h1>
    <div class="stats">
      <div>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /></svg>
        Teams: <span id="teamCount">0</span>
      </div>
      <div>
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
        Chaos: <span id="chaosCount">0</span>
      </div>
    </div>
  </header>

  <main id="dashboard"></main>

  <script>
    const DASH_URL = "http://127.0.0.1:8000/status";
    const REFRESH_INTERVAL = 2000;

    async function fetchStatus() {
      try {
        const res = await fetch(DASH_URL);
        return await res.json();
      } catch (e) {
        console.error("Error fetching status:", e);
        return null;
      }
    }

    function updateDashboard(data) {
      if (!data || !data.teams) return;
      const dashboard = document.getElementById("dashboard");

      // Sort by last_active (most recent first)
      const sortedTeams = data.teams.sort((a, b) => b.last_active - a.last_active);

      document.getElementById("teamCount").textContent = sortedTeams.length;
      document.getElementById("chaosCount").textContent = data.total_chaos ?? 0;

      sortedTeams.forEach(team => {
        const seenPct = Math.min((team.seen_count / data.total_words) * 100, 100);
        const existing = document.getElementById(`tile-${team.team}`);

        const html = `
          <h2>${team.team}</h2>
          <div class="progress-bar"><div class="progress-fill" style="width:${seenPct}%"></div></div>
          <div class="details">
            <div><strong>Seen:</strong> ${Math.round(seenPct)}%</div>
            <div><strong>Requests left:</strong> ${team.remaining}</div>
            <div><strong>Tokens issued:</strong> ${team.tokens_issued}</div>
            <div><strong>Chaos events:</strong> ${team.chaos}</div>
            <div><strong>Duration:</strong> ${team.duration.toFixed(1)}s</div>
            <div><strong>Status:</strong> ${team.completed ? "✅ Completed" : "🔄 In Progress"}</div>
          </div>
        `;

        if (existing) {
          existing.innerHTML = html;
          existing.classList.add("active-pulse");
          setTimeout(() => existing.classList.remove("active-pulse"), 1500);
        } else {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${team.team}`;
          tile.innerHTML = html;
          dashboard.appendChild(tile);
        }
      });

      // Remove inactive tiles
      Array.from(dashboard.children).forEach(tile => {
        if (!sortedTeams.find(t => `tile-${t.team}` === tile.id)) {
          tile.remove();
        }
      });
    }

    async function refresh() {
      const data = await fetchStatus();
      if (data) updateDashboard(data);
    }

    setInterval(refresh, REFRESH_INTERVAL);
    refresh();
  </script>
</body>
</html>
