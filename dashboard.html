<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Decrypt the Narrative</title>
<meta name="description" content="Live scoreboard for the Decrypt the Narrative chaos-engineering challenge." />
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<link rel="manifest" href="/static/site.webmanifest">
<style>
:root {
  --bg:        #004b2b;
  --card:      rgba(0, 104, 55, 0.9);
  --card-done: rgba(0, 122, 69, 0.95);
  --ink:       #f7f7f7;
  --muted:     #cdeac0;
  --yellow:    #ffda00;
  --green:     #00ff99;
  --green-mid: #00cc66;
  --alert:     #ff8a4c;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-variant-numeric: tabular-nums;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Reduced motion suppresses *movement* — travelling pulses, drifting
   particles, confetti, anything that scales or changes position. Colour and
   glow stay, because they carry the identity without being a vestibular
   trigger, and the metric bars keep their width transition because that is
   information rather than decoration. A blanket `animation: none` here would
   flatten the header to a static logo, which is not what reduced motion asks
   for. */
@media (prefers-reduced-motion: reduce) {
  .particle { display: none; }
  .pulse.trail { display: none; }
  .pulse { animation: none; stroke-dasharray: none; opacity: 0.95; }
  .nodes circle { animation: none; opacity: 0.95; }
  .i-decoding .ring { animation: none; opacity: 0.5; }
  .team:hover { transform: none; }
}

/* ---------- HEADER ---------- */
header {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0.8rem 0 0.5rem;
}
header svg.title { width: 760px; max-width: 95%; height: 150px; }
header text {
  font-family: var(--sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 40px;
  fill: var(--yellow);
  filter: drop-shadow(0 0 8px rgba(255, 218, 0, 0.6));
  animation: textGlow 5s ease-in-out infinite;
}
@keyframes textGlow {
  0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 218, 0, 0.5)); }
  50%      { filter: drop-shadow(0 0 24px rgba(255, 218, 0, 0.9)); }
}
/* The zigzag is a pipeline, so run traffic down it: a dim wire, a bright
   pulse travelling the dash overlay, and packets riding the same path. */
.wire {
  fill: none;
  stroke: url(#flowGradient);
  stroke-width: 2.5;
  stroke-linecap: round;
  opacity: 0.35;
}
.pulse {
  fill: none;
  stroke: var(--green);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 18 620;
  filter: drop-shadow(0 0 6px var(--green));
  animation: flow 3.2s linear infinite;
}
@keyframes flow {
  from { stroke-dashoffset: 638; }
  to   { stroke-dashoffset: 0; }
}

/* A second, offset pulse in yellow gives the wire two packets in flight. */
.pulse.trail {
  stroke: var(--yellow);
  stroke-width: 2.5;
  stroke-dasharray: 10 628;
  filter: drop-shadow(0 0 6px var(--yellow));
  animation-delay: -1.6s;
}

.nodes circle {
  fill: var(--green);
  filter: drop-shadow(0 0 4px var(--green));
  transform-box: fill-box;
  transform-origin: center;
  animation: hop 3.2s ease-in-out infinite;
}
.nodes circle:nth-child(2) { animation-delay: 0.45s; }
.nodes circle:nth-child(3) { animation-delay: 0.9s; }
.nodes circle:nth-child(4) { animation-delay: 1.35s; }
.nodes circle:nth-child(5) { animation-delay: 1.8s; }
.nodes circle:nth-child(6) { animation-delay: 2.25s; }
.nodes circle:nth-child(7) { animation-delay: 2.7s; }
@keyframes hop {
  0%, 70%, 100% { opacity: 0.55; transform: scale(1); }
  12%           { opacity: 1;    transform: scale(1.9); }
}

#header-particles {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}
.particle {
  position: absolute;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--yellow) 0%, var(--green) 100%);
  opacity: 0.4;
  animation: float 12s linear infinite;
}
@keyframes float {
  0%   { transform: translateY(0) translateX(0) scale(1); }
  50%  { transform: translateY(-120px) translateX(40px) scale(1.2); }
  100% { transform: translateY(-240px) translateX(0) scale(1); }
}

/* ---------- SUMMARY ---------- */
#summary {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.6rem 1.4rem;
  margin: 0.6rem auto 1.2rem;
  color: var(--muted);
  text-align: center;
}
.summary-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: clamp(1rem, 1.9vw, 1.4rem);
  font-weight: 600;
}
.summary-icon {
  width: clamp(22px, 2.2vw, 28px);
  height: clamp(22px, 2.2vw, 28px);
  stroke: var(--yellow);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex: none;
}
.summary-item b {
  color: #fff;
  font-weight: 700;
  text-shadow: 0 0 4px rgba(255, 255, 255, 0.2);
}

/* Only ever visible when the poll is failing. */
#link-warning {
  display: none;
  margin: -0.4rem auto 1rem;
  color: var(--alert);
  font-size: 0.9rem;
  text-align: center;
}
#link-warning.show { display: block; }

/* ---------- TEAMS ---------- */
main { flex: 1; }

#teams {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
  gap: 1rem;
  padding: 1rem;
  margin: 0 auto;
  max-width: 1600px;
}

.team {
  position: relative;
  overflow: hidden;
  padding: 1rem;
  background: var(--card);
  border: 1px solid transparent;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
  transition: transform 0.2s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.team:hover { transform: translateY(-2px); }

.team::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: linear-gradient(90deg, var(--green), var(--yellow), var(--green-mid));
  opacity: 0.9;
}
/* Completed teams are marked by a gold edge and a tick, so the state reads
   from the back of the room without needing a label. */
.team.complete {
  background: var(--card-done);
  border-color: rgba(255, 218, 0, 0.55);
  box-shadow: 0 0 16px rgba(255, 218, 0, 0.18);
}
.team.complete .tick { color: var(--yellow); }

.team h2 {
  display: flex;
  align-items: baseline;
  gap: 0.45rem;
  margin: 0.35rem 0 0.75rem;
  font-size: 1.35rem;
  color: var(--yellow);
}
.team h2 .label {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* State icon: decoding (pulsing dot), idle (hollow), decrypted (tick).
   All three are rendered; the card's class decides which one shows. */
.state {
  flex: none;
  align-self: center;
  width: 1.15em;
  height: 1.15em;
  line-height: 0;
}
.state svg { display: none; width: 100%; height: 100%; }
.team.decoding .state .i-decoding,
.team.idle     .state .i-idle,
.team.complete .state .i-done { display: block; }

.i-decoding { color: var(--green); }
.i-idle     { color: rgba(205, 234, 192, 0.45); }
.i-done     { color: var(--yellow); }

.i-decoding .core { fill: currentColor; }
.i-decoding .ring {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  transform-origin: center;
  animation: ping 1.8s ease-out infinite;
}
@keyframes ping {
  0%   { transform: scale(0.5); opacity: 0.9; }
  100% { transform: scale(1.5); opacity: 0; }
}

.i-idle circle { fill: none; stroke: currentColor; stroke-width: 2; }
.i-idle line { stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

.i-done circle { fill: currentColor; }
.i-done path { fill: none; stroke: #004b2b; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.metrics {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  row-gap: 6px;
  padding: 0.8rem;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 10px;
}
.metric-label { font-weight: 700; }
.metric-value { text-align: right; font-weight: 600; }

.bar {
  grid-column: 1 / 3;
  height: 10px;
  margin: 3px 0 8px;
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 5px;
  overflow: hidden;
}
.bar:last-child { margin-bottom: 0; }
.bar-fill {
  height: 100%;
  width: 0;
  border-radius: 4px;
  background: var(--green-mid);
  transition: width 0.6s ease-in-out, background 0.3s ease;
}
.bar-fill.words { background: linear-gradient(90deg, var(--green-mid), var(--green)); }
.team.complete .bar-fill.words { background: linear-gradient(90deg, var(--green), var(--yellow)); }
.bar-fill.requests { background: var(--yellow); }
.bar-fill.requests.low { background: var(--alert); }

/* ---------- EMPTY STATE ---------- */
#empty {
  max-width: 34rem;
  margin: 3rem auto;
  padding: 0 1rem;
  text-align: center;
  color: var(--muted);
}
#empty strong {
  display: block;
  margin-bottom: 0.6rem;
  font-size: 1.3rem;
  color: var(--yellow);
}
#empty code {
  display: block;
  max-width: 100%;
  margin-top: 1.2rem;
  padding: 0.65rem 0.9rem;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 8px;
  color: var(--yellow);
  font-size: 0.9rem;
  text-align: left;
  white-space: nowrap;
  overflow-x: auto;
}

/* ---------- FOOTER ---------- */
footer {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  padding: 0.85rem clamp(1rem, 3vw, 2.5rem);
  background: rgba(0, 60, 34, 0.94);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(6px);
  font-size: 0.9rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem 1.5rem;
}

.footer-cred {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--muted);
  text-decoration: none;
}
.footer-cred img {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.16);
  flex: none;
}
.footer-cred strong { color: #fff; font-weight: 700; }
.footer-cred:hover strong { color: var(--yellow); }

.footer-links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1.4rem;
}
.footer-links a {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s ease;
}
.footer-links a:hover { color: var(--yellow); }
.footer-links svg {
  width: 1.05em;
  height: 1.05em;
  fill: currentColor;
  flex: none;
}

#burst { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

@media (max-width: 480px) {
  #teams { grid-template-columns: 1fr; gap: 0.7rem; padding: 0.6rem; }
  .team { padding: 0.8rem; }
  #docs-link { position: static; display: inline-block; margin-top: 0.5rem; }
}
</style>
</head>
<body>

<header>
  <div id="header-particles"></div>
  <svg class="title" viewBox="0 0 700 160" role="img" aria-label="Decrypt the Narrative">
    <defs>

<script>
"use strict";

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const IDLE_AFTER = 60; // seconds without a request before a team reads as idle

/* ---------- Floating particles ---------- */
(function particles() {
  if (reduceMotion) return;
  const field = document.getElementById("header-particles");
  const items = [];
  for (let i = 0; i < 25; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    reset(p, true);
    field.appendChild(p);
    items.push(p);
  }
  function reset(p, init) {
    p.style.left = Math.random() * 100 + "%";
    p.style.top = init ? Math.random() * 100 + "%" : "100%";
    p.style.animationDuration = 10 + Math.random() * 6 + "s";
  }
  (function recycle() {
    for (const p of items) {
      const top = parseFloat(p.style.top);
      if (top < -5) reset(p, false);
      else p.style.top = top - 0.2 + "%";
    }
    requestAnimationFrame(recycle);
  })();
})();

/* ---------- Confetti on a new completion ---------- */
const burst = (function () {
  const canvas = document.getElementById("burst");
  const ctx = canvas.getContext("2d");
  const COLOURS = ["#ffda00", "#00ff99", "#00cc66", "#ffffff"];
  let bits = [];
  let running = false;

  function resize() {
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) {
      b.vy += 0.16;
      b.x += b.vx;
      b.y += b.vy;
      b.spin += b.dspin;
      b.life--;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.spin);
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life / 40));
      ctx.fillStyle = b.colour;
      ctx.fillRect(-b.size / 2, -b.size / 4, b.size, b.size / 2);
      ctx.restore();
    }
    bits = bits.filter((b) => b.life > 0 && b.y < innerHeight + 40);
    if (bits.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  return function fire(count) {
    if (reduceMotion) return;
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
      const speed = 7 + Math.random() * 12;
      bits.push({
        x: innerWidth / 2 + (Math.random() - 0.5) * 240,
        y: innerHeight * 0.7,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 6 + Math.random() * 7,
        spin: Math.random() * 6.28,
        dspin: (Math.random() - 0.5) * 0.3,
        life: 85 + Math.random() * 55,
        colour: COLOURS[(Math.random() * COLOURS.length) | 0],
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  };
})();

/* ---------- Helpers ---------- */
function formatDuration(sec) {
  if (!sec || sec < 0) return "0s";
  const s = Math.floor(sec % 60);
  const m = Math.floor((sec % 3600) / 60);
  const h = Math.floor(sec / 3600);
  if (h) return h + "h " + m + "m";
  if (m) return m + "m " + s + "s";
  return s + "s";
}

/* ---------- Cards ----------
   Cards are cached per team and updated in place. Rebuilding the grid on
   every poll would restart each bar transition 40 times a minute.        */
const cards = new Map();
const container = document.getElementById("teams");
const emptyState = document.getElementById("empty");
let knownComplete = new Set();
let firstPaint = true;

function buildCard() {
  const el = document.createElement("article");
  el.className = "team";
  el.innerHTML =
    '<h2>' +
      '<span class="state" aria-hidden="true">' +
        '<svg class="i-decoding" viewBox="0 0 24 24">' +
          '<circle class="ring" cx="12" cy="12" r="7"/><circle class="core" cx="12" cy="12" r="4"/>' +
        '</svg>' +
        '<svg class="i-idle" viewBox="0 0 24 24">' +
          '<circle cx="12" cy="12" r="8"/><line x1="10" y1="9" x2="10" y2="15"/><line x1="14" y1="9" x2="14" y2="15"/>' +
        '</svg>' +
        '<svg class="i-done" viewBox="0 0 24 24">' +
          '<circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.6 2.6L16 9.6"/>' +
        '</svg>' +
      '</span>' +
      '<span class="label"></span><span class="sr-only state-text"></span>' +
    '</h2>' +
    '<div class="metrics">' +
      '<div class="metric-label">Words</div><div class="metric-value words-text"></div>' +
      '<div class="bar"><div class="bar-fill words"></div></div>' +
      '<div class="metric-label">Requests</div><div class="metric-value requests-text"></div>' +
      '<div class="bar"><div class="bar-fill requests"></div></div>' +
      '<div class="metric-label">Chaos</div><div class="metric-value chaos-text"></div>' +
      '<div class="metric-label">Duration</div><div class="metric-value duration-text"></div>' +
    '</div>';
  el.refs = {
    label: el.querySelector(".label"),
    stateText: el.querySelector(".state-text"),
    wordsText: el.querySelector(".words-text"),
    words: el.querySelector(".bar-fill.words"),
    requestsText: el.querySelector(".requests-text"),
    requests: el.querySelector(".bar-fill.requests"),
    chaos: el.querySelector(".chaos-text"),
    duration: el.querySelector(".duration-text"),
  };
  return el;
}

function render(data) {
  const teams = Array.isArray(data.teams) ? data.teams : [];
  const totalWords = data.total_words || 1;

  document.getElementById("count-teams").textContent = teams.length;
  document.getElementById("count-tokens").textContent =
    teams.reduce((n, t) => n + (t.tokens_issued || 0), 0);
  document.getElementById("count-chaos").textContent = data.total_chaos || 0;
  document.getElementById("count-completed").textContent =
    teams.filter((t) => t.completed).length;

  // Finished first and fastest, then whoever has recovered the most words.
  teams.sort((a, b) => {
    if (a.completed !== b.completed) return a.completed ? -1 : 1;
    if (a.completed && b.completed) return a.duration - b.duration;
    return (b.unique_seen || 0) - (a.unique_seen || 0);
  });

  emptyState.style.display = teams.length ? "none" : "";

  const live = new Set();
  for (const t of teams) {
    const key = String(t.team);
    live.add(key);

    let el = cards.get(key);
    if (!el) {
      el = buildCard();
      cards.set(key, el);
      // textContent, never innerHTML: team names are arbitrary user input
      // and this board goes on a projector.
      el.refs.label.textContent = key;
    }

    const seen = t.unique_seen || 0;
    const quotaMax = t.max || 20;
    const words = Math.max(0, Math.min(100, (seen / totalWords) * 100));
    const quota = Math.max(0, Math.min(100, ((t.remaining || 0) / quotaMax) * 100));

    // A team is idle once it has gone IDLE_AFTER without a request. Chaos can
    // stall a single call for ~6s, so the threshold sits well clear of that.
    const state = t.completed ? "complete"
      : (t.idle_seconds || 0) >= IDLE_AFTER ? "idle"
      : "decoding";

    el.className = "team " + state;
    el.refs.stateText.textContent = state === "complete" ? "Decrypted"
      : state === "idle" ? "Idle" : "Decoding";
    el.refs.wordsText.textContent = seen + " / " + totalWords;
    el.refs.words.style.width = words + "%";
    el.refs.requestsText.textContent = (t.remaining || 0) + " / " + quotaMax;
    el.refs.requests.style.width = quota + "%";
    el.refs.requests.classList.toggle("low", quota <= 25);
    el.refs.chaos.textContent = t.chaos || 0;
    el.refs.duration.textContent = formatDuration(t.duration);

    // Re-appending an existing node moves it, which is the reorder.
    container.appendChild(el);
  }

  for (const [key, el] of cards) {
    if (!live.has(key)) { el.remove(); cards.delete(key); }
  }

  // Celebrate new completions, but not on first paint — reloading the page
  // mid-event should not re-fire every win.
  const complete = new Set(teams.filter((t) => t.completed).map((t) => String(t.team)));
  if (!firstPaint) {
    let fresh = 0;
    for (const team of complete) if (!knownComplete.has(team)) fresh++;
    if (fresh) burst(80 * Math.min(fresh, 3));
  }
  knownComplete = complete;
  firstPaint = false;
}

/* ---------- Polling ---------- */
const warning = document.getElementById("link-warning");
let lastGoodPoll = 0;

async function poll() {
  try {
    const res = await fetch("/status", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    lastGoodPoll = Date.now();
    warning.classList.remove("show");
  } catch (err) {
    // The board itself has to survive a flaky server — a poor advert for a
    // resilience challenge otherwise.
    const stale = lastGoodPoll ? Math.round((Date.now() - lastGoodPoll) / 1000) : null;
    warning.textContent = stale === null
      ? "Cannot reach the server — retrying."
      : "Connection lost — last update " + stale + "s ago.";
    warning.classList.add("show");
  }
}

poll();
setInterval(poll, 1500);
</script>
</body>
