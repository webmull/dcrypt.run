<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decrypt the Narrative Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f6f7f5;
      color: #222;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #00683A;
      color: #fff;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .stats {
      display: flex;
      gap: 24px;
      font-size: 1.1em;
    }

    .stats div {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 30px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      align-content: start;
    }

    .tile {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      transition: box-shadow 0.2s ease;
    }

    .tile:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .tile h2 {
      font-size: 1.15em;
      margin: 0 0 10px;
      color: #00683A;
    }

    .progress-bar {
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00A859, #00c96b);
      width: 0%;
      transition: width 0.6s ease;
    }

    .details {
      font-size: 0.9em;
      color: #444;
      display: grid;
      gap: 3px;
    }

    @media (max-width: 768px) {
      header h1 { font-size: 1.5em; }
      .stats { font-size: 0.95em; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Decrypt the Narrative</h1>
    <div class="stats">
      <div>Teams: <span id="teamCount">0</span></div>
      <div>Chaos: <span id="chaosCount">0</span></div>
    </div>
  </header>

  <main id="dashboard"></main>

  <script>
    const DASH_URL = "http://127.0.0.1:8000/status";
    const REFRESH_INTERVAL = 2000;

    async function fetchStatus() {
      try {
        const res = await fetch(DASH_URL);
        return await res.json();
      } catch (e) {
        console.error("Error fetching status:", e);
        return null;
      }
    }

    function updateDashboard(data) {
      if (!data || !data.teams) return;
      const dashboard = document.getElementById("dashboard");
      dashboard.innerHTML = "";

      document.getElementById("teamCount").textContent = data.teams.length;
      document.getElementById("chaosCount").textContent = data.total_chaos ?? 0;

      data.teams.forEach(team => {
        const seenPct = Math.min((team.seen_count / data.total_words) * 100, 100);
        const tile = document.createElement("div");
        tile.className = "tile";

        tile.innerHTML = `
          <h2>${team.team}</h2>
          <div class="progress-bar"><div class="progress-fill" style="width:${seenPct}%"></div></div>
          <div class="details">
            <div><strong>Seen:</strong> ${Math.round(seenPct)}%</div>
            <div><strong>Requests left:</strong> ${team.remaining}</div>
            <div><strong>Tokens issued:</strong> ${team.tokens_issued}</div>
            <div><strong>Chaos events:</strong> ${team.chaos}</div>
            <div><strong>Duration:</strong> ${team.duration.toFixed(1)}s</div>
            <div><strong>Status:</strong> ${team.completed ? "✅ Completed" : "🔄 In Progress"}</div>
          </div>
        `;

        dashboard.appendChild(tile);
      });
    }

    async function refresh() {
      const data = await fetchStatus();
      if (data) updateDashboard(data);
    }

    setInterval(refresh, REFRESH_INTERVAL);
    refresh();
  </script>
</body>
</html>
